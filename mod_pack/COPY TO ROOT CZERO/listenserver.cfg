// Use this file to configure your LISTEN server. 
// This config file is executed everytime the server changes levels.

// disable autoaim
sv_aim 0

// disable clients' ability to pause the server
pausable 0

// default server name. Change to "Bob's Server", etc.
// hostname "Condition Zero"

// maximum client movement speed 
sv_maxspeed 320

// 20 minute timelimit
// mp_timelimit 20

sv_cheats 0
decalfrequency 0
mp_decals 4096 
r_decals 4096

// Network: allow more data per player (LAN). The old defaults (30 updates/s, ~30 KB/s) are too
// small for busy open maps like fy_$2000$ with 20 players: friends see stutter ("choke").
sv_maxrate 100000
sv_minrate 25000
sv_maxupdaterate 100
sv_minupdaterate 30
